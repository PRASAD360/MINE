name: GOOGLE_SHEETS_SYNC

on:
  schedule:
    - cron: '30 19 * * *'  # 1:00 AM IST
    - cron: '30 0 * * *'   # 6:00 AM IST
    - cron: '30 2 * * *'   # 8:00 AM IST
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Official CSV URL to fetch'
        required: true
        default: 'https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv'
      worksheet_name:
        description: 'Worksheet Tab Name (e.g., Sheet1)'
        required: true
        default: 'Sheet1'

jobs:
  sync_to_sheets:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache Python Dependencies
      uses: actions/cache@v3
      id: pip-cache
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-gsheets
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        pip install gspread google-auth --disable-pip-version-check

    - name: Fetch CSV and Add Timestamp
      env:
        CSV_URL: ${{ github.event.inputs.csv_url || 'https://www.niftyindices.com/IndexConstituent/ind_nifty50list.csv' }}
      run: |
        echo "Fetching from: $CSV_URL"
        curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$CSV_URL" > temp.csv
        CURRENT_TIME=$(env TZ=Asia/Kolkata date "+%Y-%m-%d %H:%M:%S IST")
        awk -v time="$CURRENT_TIME" 'NR==1 {print $0 ",Fetch_Time"} NR>1 {print $0 "," time}' temp.csv > target_list.csv
        rm temp.csv

    - name: Sync Data to Google Sheets
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        WORKSHEET_NAME: ${{ github.event.inputs.worksheet_name || 'Sheet1' }} 
      run: |
        python3 -c "
        import csv, os, json
        import gspread
        from google.oauth2.service_account import Credentials

        creds_json = os.environ.get('GCP_CREDENTIALS')
        spreadsheet_id = os.environ.get('SPREADSHEET_ID')
        worksheet_name = os.environ.get('WORKSHEET_NAME')

        if not creds_json or not spreadsheet_id:
            print('Error: GCP_CREDENTIALS aur SPREADSHEET_ID secrets set nahi hain.')
            exit(1)

        # 1. Read CSV Data
        data_to_upload = []
        with open('target_list.csv', mode='r', encoding='utf-8-sig') as f:
            reader = csv.reader(f)
            for row in reader:
                if any(row):
                    data_to_upload.append(row)

        if len(data_to_upload) <= 1:
            print('Error: No valid data found in CSV. Aborting to protect existing sheet.')
            exit(1)

        # 2. Authenticate with Google
        try:
            scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
            creds_dict = json.loads(creds_json)
            credentials = Credentials.from_service_account_info(creds_dict, scopes=scopes)
            gc = gspread.authorize(credentials)
        except Exception as e:
            print(f'Authentication Error: Kripya apna GCP_CREDENTIALS JSON check karein. {e}')
            exit(1)

        # 3. Update Google Sheet
        try:
            print(f'Connecting to Spreadsheet ID: {spreadsheet_id}')
            sh = gc.open_by_key(spreadsheet_id)
            worksheet = sh.worksheet(worksheet_name)
            
            print('Clearing old data and inserting new data safely...')
            worksheet.clear()
            worksheet.update(data_to_upload, 'A1')
            
            print(f'Success! Synced {len(data_to_upload) - 1} rows to Google Sheets.')
            
        except gspread.exceptions.APIError as e:
            print(f'Google API Error: Kya aapne sheet ko Service Account email ke sath share kiya hai? {e}')
            exit(1)
        except Exception as e:
            print(f'Error updating sheet: {e}')
            exit(1)
        "

    - name: Clean up temporary file
      run: rm -f target_list.csv
