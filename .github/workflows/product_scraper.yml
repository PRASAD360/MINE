name: Ultimate React/Next.js Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/product-category/pc-components/processor/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Puppeteer Stealth
        run: |
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth csv-writer

      - name: Run Next.js Smart Scraper
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/product-category/pc-components/processor/' }}
        run: |
          node -e "
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          const { createObjectCsvWriter } = require('csv-writer');

          (async () => {
            const targetUrl = process.env.TARGET_URL;
            console.log('Launching Stealth Browser for Next.js App:', targetUrl);
            
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.setViewport({ width: 1366, height: 768 });
            
            try {
              console.log('Navigating...');
              await page.goto(targetUrl, { waitUntil: 'networkidle0', timeout: 60000 });
              
              // Extra wait for React to hydrate and render DOM
              console.log('Waiting 5 seconds for React components to load...');
              await new Promise(r => setTimeout(r, 5000));
              
              const pageTitle = await page.title();
              console.log('Page Title loaded as:', pageTitle);
              
              // UNIVERSAL TEXT-BASED EXTRACTION (Ignores CSS Classes)
              const products = await page.evaluate(() => {
                // 1. Find all deepest text elements containing '₹'
                const allElements = document.querySelectorAll('*');
                const priceNodes = Array.from(allElements).filter(el => 
                  el.children.length === 0 && el.textContent.includes('₹')
                );
                
                const items = [];
                const seenNames = new Set();
                
                priceNodes.forEach(priceEl => {
                  // Ignore huge blocks of text
                  if(priceEl.textContent.length > 40) return;
                  
                  let container = priceEl.parentElement;
                  let depth = 0;
                  let found = false;
                  
                  // Crawl up the DOM tree up to 8 levels to find the product name
                  while(container && depth < 8 && !found) {
                    // Look for Heading tags which usually contain the product title
                    const titleEl = container.querySelector('h1, h2, h3, h4, h5, h6');
                    
                    if (titleEl && titleEl.innerText.trim().length > 5) {
                      const name = titleEl.innerText.trim().replace(/,/g, ' ');
                      
                      if (!seenNames.has(name)) {
                        seenNames.add(name);
                        
                        let mrp = 'N/A';
                        let salePrice = priceEl.innerText.trim().replace(/,/g, '');
                        
                        // Check for strikethrough (del, s, strike) for MRP in the same container
                        const delEl = container.querySelector('del, strike, s');
                        if (delEl) {
                          mrp = delEl.innerText.trim().replace(/,/g, '');
                        }
                        
                        items.push({ name, mrp, salePrice });
                        found = true;
                      }
                    }
                    container = container.parentElement;
                    depth++;
                  }
                });
                return items;
              });

              console.log(\`Success! Visually extracted \${products.length} products.\`);

              if (products.length > 0) {
                const csvWriter = createObjectCsvWriter({
                  path: 'products_list.csv',
                  header: [
                    { id: 'name', title: 'Product Name' },
                    { id: 'mrp', title: 'MRP' },
                    { id: 'salePrice', title: 'Sale Price' }
                  ]
                });
                
                await csvWriter.writeRecords(products);
                console.log('CSV file successfully generated!');
              } else {
                console.log('WARNING: Still 0 products found. The page might require scrolling to load items.');
              }
            } catch (error) {
              console.error('Scraping Error:', error);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add products_list.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated CSV via React Scraper"
          git push
