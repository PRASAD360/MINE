name: Ultimate Master Deep Crawler

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Puppeteer Stealth
        run: |
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth csv-writer

      - name: Run Master Deep Crawler
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/' }}
        run: |
          node -e "
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          const { createObjectCsvWriter } = require('csv-writer');

          (async () => {
            const baseUrl = process.env.TARGET_URL;
            console.log('Launching Stealth Browser for Full Crawl:', baseUrl);
            
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.setViewport({ width: 1366, height: 768 });
            
            try {
              console.log('Navigating to homepage...');
              await page.goto(baseUrl, { waitUntil: 'networkidle2', timeout: 60000 });
              await new Promise(r => setTimeout(r, 5000));
              
              // 1. Extract all product category links from the homepage
              const categoryLinks = await page.evaluate(() => {
                const links = Array.from(document.querySelectorAll('a[href*=\"/product-category/\"]'));
                // Remove duplicates and hash links
                const uniqueLinks = [...new Set(links.map(a => a.href.split('#')[0]))];
                return uniqueLinks;
              });

              console.log(\`Found \${categoryLinks.length} unique category links to crawl.\`);

              let allProducts = [];
              let seenNames = new Set();

              // 2. Loop through each category page
              // Note: Limiting to 25 categories max to avoid GitHub Actions 6-hour timeout limits
              const maxCategories = Math.min(categoryLinks.length, 25);
              
              for (let i = 0; i < maxCategories; i++) {
                const currentUrl = categoryLinks[i];
                console.log(\`\\n[Page \${i+1}/\${maxCategories}] Crawling: \${currentUrl}\`);
                
                try {
                  await page.goto(currentUrl, { waitUntil: 'networkidle2', timeout: 60000 });
                  
                  // Auto-scroll down the page to trigger React lazy-loading
                  await page.evaluate(async () => {
                    await new Promise((resolve) => {
                      let totalHeight = 0;
                      let distance = 500;
                      let timer = setInterval(() => {
                        let scrollHeight = document.body.scrollHeight;
                        window.scrollBy(0, distance);
                        totalHeight += distance;
                        if (totalHeight >= scrollHeight - 500) {
                          clearInterval(timer);
                          resolve();
                        }
                      }, 400);
                    });
                  });
                  
                  await new Promise(r => setTimeout(r, 3000)); // Final wait for elements to render

                  // 3. Smart Extraction Logic
                  const products = await page.evaluate(() => {
                    const allElements = document.querySelectorAll('*');
                    const priceNodes = Array.from(allElements).filter(el => 
                      el.children.length === 0 && el.textContent.includes('₹')
                    );
                    
                    const items = [];
                    
                    priceNodes.forEach(priceEl => {
                      if(priceEl.textContent.length > 40) return;
                      
                      let container = priceEl.parentElement;
                      let depth = 0;
                      let found = false;
                      
                      while(container && depth < 8 && !found) {
                        const titleEl = container.querySelector('h1, h2, h3, h4, h5, h6');
                        
                        if (titleEl && titleEl.innerText.trim().length > 5) {
                          const name = titleEl.innerText.trim().replace(/,/g, ' ');
                          let mrp = 'N/A';
                          let salePrice = priceEl.innerText.trim().replace(/,/g, '');
                          
                          const delEl = container.querySelector('del, strike, s');
                          if (delEl) {
                            mrp = delEl.innerText.trim().replace(/,/g, '');
                          }
                          
                          items.push({ name, mrp, salePrice });
                          found = true;
                        }
                        container = container.parentElement;
                        depth++;
                      }
                    });
                    return items;
                  });

                  // Add to global list, avoiding cross-category duplicates
                  let newItemsAdded = 0;
                  products.forEach(p => {
                    if (!seenNames.has(p.name)) {
                      seenNames.add(p.name);
                      allProducts.push(p);
                      newItemsAdded++;
                    }
                  });
                  
                  console.log(\`Extracted \${newItemsAdded} new products from this category.\`);
                  
                } catch (catError) {
                  console.log(\`Skipping \${currentUrl} due to error: \${catError.message}\`);
                }
              }

              console.log(\`\\n--- CRAWL COMPLETE: \${allProducts.length} total unique products extracted! ---\`);

              // 4. Save everything to a master CSV
              if (allProducts.length > 0) {
                const csvWriter = createObjectCsvWriter({
                  path: 'modx_full_catalog.csv',
                  header: [
                    { id: 'name', title: 'Product Name' },
                    { id: 'mrp', title: 'MRP' },
                    { id: 'salePrice', title: 'Sale Price' }
                  ]
                });
                
                await csvWriter.writeRecords(allProducts);
                console.log('modx_full_catalog.csv successfully generated!');
              } else {
                console.log('WARNING: No products were extracted across all crawled pages.');
              }
            } catch (error) {
              console.error('Fatal Crawler Error:', error);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add modx_full_catalog.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-crawled full website catalog"
          git push
