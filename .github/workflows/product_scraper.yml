name: Stealth Dynamic Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/product-category/pc-components/processor/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Stealth Dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Run Stealth Scraper
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/product-category/pc-components/processor/' }}
        run: |
          python -c "
          import os, csv
          from bs4 import BeautifulSoup
          from curl_cffi import requests
          
          target_url = os.environ.get('TARGET_URL')
          print(f'Fetching stealthily from: {target_url}')
          
          try:
              # 'impersonate' spoofs the exact signature of Chrome 110 to bypass Cloudflare
              response = requests.get(target_url, impersonate='chrome110', timeout=30)
              
              if response.status_code == 200:
                  soup = BeautifulSoup(response.text, 'html.parser')
                  products_data = []
                  
                  product_blocks = soup.find_all(['li', 'div'], class_=['product', 'type-product'])
                  print(f'Bypass successful! Found {len(product_blocks)} products on the page.')
                  
                  for item in product_blocks:
                      title_tag = item.find(['h2', 'h3'])
                      name = title_tag.text.strip() if title_tag else 'N/A'
                      
                      price_span = item.find('span', class_='price')
                      mrp, sale_price = 'N/A', 'N/A'
                      
                      if price_span:
                          del_tag = price_span.find('del')
                          ins_tag = price_span.find('ins')
                          if del_tag and ins_tag:
                              mrp = del_tag.text.strip()
                              sale_price = ins_tag.text.strip()
                          else:
                              sale_price = price_span.text.strip()
                      
                      if name != 'N/A':
                          products_data.append([name, mrp, sale_price])
                  
                  if products_data:
                      with open('products_list.csv', 'w', newline='', encoding='utf-8') as f:
                          writer = csv.writer(f)
                          writer.writerow(['Product Name', 'MRP', 'Sale Price'])
                          writer.writerows(products_data)
                      print(f'Success! Saved {len(products_data)} products to CSV.')
                  else:
                      print('WARNING: 0 products found. Layout might be different.')
              else:
                  print(f'Failed! HTTP Status: {response.status_code}')
          except Exception as e:
              print(f'Error occurred: {e}')
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add products_list.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated CSV via Stealth Scraper"
          git push
