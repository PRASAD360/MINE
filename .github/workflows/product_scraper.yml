name: Ultimate Stealth Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/product-category/pc-components/processor/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Puppeteer Stealth
        run: |
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth csv-writer

      - name: Run Stealth Scraper
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/product-category/pc-components/processor/' }}
        run: |
          node -e "
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          const { createObjectCsvWriter } = require('csv-writer');

          (async () => {
            const targetUrl = process.env.TARGET_URL;
            console.log('Launching Stealth Browser for:', targetUrl);
            
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            // Randomize viewport to look human
            await page.setViewport({ width: 1366, height: 768 });
            
            try {
              console.log('Navigating...');
              await page.goto(targetUrl, { waitUntil: 'networkidle2', timeout: 60000 });
              
              // Wait for 5 seconds to let Cloudflare JS challenge finish
              console.log('Waiting for 5 seconds to bypass Cloudflare JS...');
              await new Promise(r => setTimeout(r, 5000));
              
              const pageTitle = await page.title();
              console.log('Page Title loaded as:', pageTitle);
              
              if (pageTitle.includes('Just a moment') || pageTitle.includes('Cloudflare')) {
                  console.log('FAILED: Cloudflare is still blocking the GitHub Action IP completely.');
              }

              const products = await page.evaluate(() => {
                const items = Array.from(document.querySelectorAll('.product, li.product'));
                return items.map(item => {
                  const titleNode = item.querySelector('.woocommerce-loop-product__title, h2, h3');
                  const name = titleNode ? titleNode.innerText.trim() : 'N/A';
                  
                  const priceNode = item.querySelector('.price');
                  let mrp = 'N/A';
                  let salePrice = 'N/A';
                  
                  if (priceNode) {
                    const del = priceNode.querySelector('del');
                    const ins = priceNode.querySelector('ins');
                    if (del && ins) {
                      mrp = del.innerText.trim();
                      salePrice = ins.innerText.trim();
                    } else {
                      salePrice = priceNode.innerText.trim();
                    }
                  }
                  return { name, mrp, salePrice };
                });
              });

              console.log(\`Successfully extracted \${products.length} products!\`);

              if (products.length > 0) {
                const csvWriter = createObjectCsvWriter({
                  path: 'products_list.csv',
                  header: [
                    { id: 'name', title: 'Product Name' },
                    { id: 'mrp', title: 'MRP' },
                    { id: 'salePrice', title: 'Sale Price' }
                  ]
                });
                
                await csvWriter.writeRecords(products);
                console.log('CSV file written successfully.');
              }
            } catch (error) {
              console.error('Scraping Error:', error);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add products_list.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated via Puppeteer Stealth Scraper"
          git push
