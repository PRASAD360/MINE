name: Ultimate Smart Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/product-category/pc-components/processor/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Puppeteer Stealth
        run: |
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth csv-writer

      - name: Run Smart Scraper
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/product-category/pc-components/processor/' }}
        run: |
          node -e "
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());
          const { createObjectCsvWriter } = require('csv-writer');

          (async () => {
            const targetUrl = process.env.TARGET_URL;
            console.log('Launching Stealth Browser for:', targetUrl);
            
            const browser = await puppeteer.launch({ 
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.setViewport({ width: 1366, height: 768 });
            
            try {
              console.log('Navigating...');
              await page.goto(targetUrl, { waitUntil: 'networkidle2', timeout: 60000 });
              
              console.log('Waiting 5 seconds for products to fully render...');
              await new Promise(r => setTimeout(r, 5000));
              
              const pageTitle = await page.title();
              console.log('Page Title loaded as:', pageTitle);
              
              // SMART EXTRACTION: Hunts for prices first, then finds the names backwards
              const products = await page.evaluate(() => {
                const priceNodes = Array.from(document.querySelectorAll('.price, .amount, .woocommerce-Price-amount'));
                const items = [];
                const seenNames = new Set();
                
                priceNodes.forEach(priceEl => {
                  let container = priceEl.parentElement;
                  let depth = 0;
                  let found = false;
                  
                  // Go up the DOM tree up to 6 levels to find the product name
                  while(container && depth < 6 && !found) {
                    const titleEl = container.querySelector('h2, h3, h4, [class*=\"title\"], [class*=\"name\"]');
                    
                    if (titleEl && titleEl.innerText.trim().length > 5) {
                      const name = titleEl.innerText.trim().replace(/,/g, '');
                      
                      // Avoid duplicates
                      if (!seenNames.has(name)) {
                        seenNames.add(name);
                        
                        let mrp = 'N/A';
                        let salePrice = 'N/A';
                        
                        const del = container.querySelector('del');
                        const ins = container.querySelector('ins');
                        
                        if (del && ins) {
                          mrp = del.innerText.trim().replace(/,/g, '').replace(/\n/g, ' ');
                          salePrice = ins.innerText.trim().replace(/,/g, '').replace(/\n/g, ' ');
                        } else {
                          salePrice = priceEl.innerText.trim().replace(/,/g, '').replace(/\n/g, ' ');
                        }
                        
                        items.push({ name, mrp, salePrice });
                        found = true;
                      }
                    }
                    container = container.parentElement;
                    depth++;
                  }
                });
                return items;
              });

              console.log(\`Successfully extracted \${products.length} products!\`);

              if (products.length > 0) {
                const csvWriter = createObjectCsvWriter({
                  path: 'products_list.csv',
                  header: [
                    { id: 'name', title: 'Product Name' },
                    { id: 'mrp', title: 'MRP' },
                    { id: 'salePrice', title: 'Sale Price' }
                  ]
                });
                
                await csvWriter.writeRecords(products);
                console.log('CSV file written successfully.');
              } else {
                console.log('WARNING: Still 0 products. Dumping page HTML snippet for debugging:');
                const bodyHTML = await page.evaluate(() => document.body.innerHTML.substring(0, 1500));
                console.log(bodyHTML);
              }
            } catch (error) {
              console.error('Scraping Error:', error);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add products_list.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated CSV via Smart Stealth Scraper"
          git push
