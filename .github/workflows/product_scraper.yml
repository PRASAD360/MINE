name: Ultimate Dynamic Scraper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target Website URL to Scrape'
        required: true
        default: 'https://modxcomputers.com/product-category/pc-components/'
  
  schedule:
    - cron: '0 0 * * *' 

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Playwright & Chromium
        run: |
          npm init -y
          npm install playwright csv-writer
          npx playwright install --with-deps chromium

      - name: Run Playwright Scraper
        env:
          TARGET_URL: ${{ github.event.inputs.url || 'https://modxcomputers.com/product-category/pc-components/' }}
        run: |
          node -e "
          const { chromium } = require('playwright');
          const { createObjectCsvWriter } = require('csv-writer');

          (async () => {
            console.log('Launching headless Chrome...');
            const browser = await chromium.launch({ headless: true });
            
            // Masking the browser to look like a real user
            const context = await browser.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            });
            const page = await context.newPage();
            
            const targetUrl = process.env.TARGET_URL;
            console.log('Navigating to:', targetUrl);
            
            try {
              // Wait until network is mostly idle (bypasses loading screens)
              await page.goto(targetUrl, { waitUntil: 'networkidle', timeout: 60000 });
              
              console.log('Page loaded. Waiting 5 seconds for JS/Cloudflare to settle...');
              await page.waitForTimeout(5000);
              
              // Extracting data using standard WooCommerce classes
              const products = await page.\$\$eval('.product, li.product', items => {
                return items.map(item => {
                  const titleNode = item.querySelector('.woocommerce-loop-product__title, h2, h3');
                  const name = titleNode ? titleNode.innerText.trim() : 'Unknown Product';
                  
                  const priceNode = item.querySelector('.price');
                  let mrp = 'N/A';
                  let salePrice = 'N/A';
                  
                  if (priceNode) {
                    const del = priceNode.querySelector('del');
                    const ins = priceNode.querySelector('ins');
                    if (del && ins) {
                      mrp = del.innerText.trim();
                      salePrice = ins.innerText.trim();
                    } else {
                      salePrice = priceNode.innerText.trim();
                    }
                  }
                  
                  return { name, mrp, salePrice };
                });
              });

              console.log(\`Successfully extracted \${products.length} products!\`);

              if (products.length > 0) {
                const csvWriter = createObjectCsvWriter({
                  path: 'products_list.csv',
                  header: [
                    { id: 'name', title: 'Product Name' },
                    { id: 'mrp', title: 'MRP' },
                    { id: 'salePrice', title: 'Sale Price' }
                  ]
                });
                
                await csvWriter.writeRecords(products);
                console.log('CSV file written successfully.');
              } else {
                console.log('WARNING: No products found. The site might have blocked the IP or changed its layout.');
              }

            } catch (error) {
              console.error('Error during scraping:', error);
            } finally {
              await browser.close();
            }
          })();
          "

      - name: Commit and Push CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add products_list.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-updated products CSV via Playwright"
          git push
