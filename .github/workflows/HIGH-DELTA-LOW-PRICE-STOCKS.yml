name: Nifty High Beta Filter (Batch Optimized)

on:
  schedule:
    - cron: '48 10 * * 1-5'  # 4:18 PM IST
  workflow_dispatch:

env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  CONFIG_WS: 'Config'
  CONFIG_PERIOD_CELL: 'A1'
  CONFIG_INTERVAL_CELL: 'A2'
  SYMBOLS_WS: 'NIFTY500'
  SYMBOLS_RANGE: 'A2:A50'  
  TARGET_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  TARGET_TAB_NAME: 'HIGH_BETA-LOW_PRICE' 

jobs:
  filter_high_beta:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pandas numpy --disable-pip-version-check

    - name: Run Filter Engine
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python3 -c "
        import os, json, gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        import pandas as pd
        import numpy as np

        creds = Credentials.from_service_account_info(
            json.loads(os.environ['GCP_CREDENTIALS']), 
            scopes=['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        )
        gc = gspread.authorize(creds)
        env = os.environ
        
        source_sh = gc.open_by_key(env['SOURCE_SPREADSHEET_ID'])

        # 1. Fetch Symbols from Google Sheet
        batch_data = source_sh.values_batch_get([f\"{env['SYMBOLS_WS']}!{env['SYMBOLS_RANGE']}\"]).get('valueRanges', [])
        raw_symbols = [r[0].strip() for r in batch_data[0].get('values', []) if r and str(r[0]).strip()]
        print(f'Total Symbols Found: {len(raw_symbols)}')

        # 2. Fetch Nifty 50 Benchmark
        print('Downloading Nifty 50 Benchmark...')
        nifty = yf.download('^NSEI', period='1y', interval='1d', progress=False)
        if nifty.empty:
            print('CRITICAL: Yahoo Finance blocked Nifty 50 data. Exiting.')
            exit(1)
            
        nifty.index = pd.to_datetime(nifty.index.strftime('%Y-%m-%d'))
        nifty_returns = nifty['Close'].pct_change().dropna()
        nifty_var = float(nifty_returns.var().iloc[0] if isinstance(nifty_returns.var(), pd.Series) else nifty_returns.var())

        # 3. YFINANCE BATCH DOWNLOAD (THE BULLETPROOF FIX)
        print('Batch Downloading 500 stocks in 1 API call (To avoid IP ban)...')
        valid_tickers = [sym + '.NS' if not sym.endswith('.NS') else sym for sym in raw_symbols]
        
        # Download all at once
        data = yf.download(valid_tickers, period='1y', interval='1d', progress=False)
        
        results = []
        
        # 4. Math & Filter Loop (Offline Calculation)
        print('Crunching Beta and Price conditions...')
        for i, sym in enumerate(raw_symbols):
            ticker = valid_tickers[i]
            try:
                # Extract stock close prices
                if ticker not in data['Close']:
                    continue
                    
                stock_close = data['Close'][ticker].dropna()
                if len(stock_close) < 50:
                    continue
                    
                current_price = float(stock_close.iloc[-1])
                
                # PRICE FILTER (100 to 500)
                if not (100 <= current_price <= 500):
                    continue
                    
                stock_returns = stock_close.pct_change().dropna()
                stock_returns.index = pd.to_datetime(stock_returns.index.strftime('%Y-%m-%d'))
                
                # Align dates to fix holiday mismatches
                aligned = pd.concat([stock_returns, nifty_returns], axis=1, join='inner').dropna()
                if len(aligned) < 50:
                    continue
                    
                cov = aligned.iloc[:, 0].cov(aligned.iloc[:, 1])
                beta = float(cov / nifty_var)
                
                # BETA FILTER (> 1.2)
                if beta > 1.2:
                    print(f'MATCH -> {sym}: Price={current_price:.2f}, Beta={beta:.2f}')
                    results.append([sym, round(current_price, 2), round(beta, 2)])
            except Exception as e:
                pass

        # 5. Push to Google Sheets
        if not results:
            print('\nWARNING: Filter condition is too strict. No stocks found.')
            final_data = [['Symbol', 'Current_Price', 'Beta'], ['No match found', '', '']]
        else:
            results.sort(key=lambda x: x[2], reverse=True)
            final_data = [['Symbol', 'Current_Price', 'Beta']] + results

        target_sh = gc.open_by_key(env['TARGET_SPREADSHEET_ID'])
        target_tab = env['TARGET_TAB_NAME']
        existing_ws = {ws.title: ws for ws in target_sh.worksheets()}
        
        needed_rows = max(100, len(final_data) + 10)
        
        if target_tab not in existing_ws:
            ws = target_sh.add_worksheet(title=target_tab, rows=needed_rows, cols=5)
        else:
            ws = existing_ws[target_tab]
            if ws.row_count < needed_rows:
                ws.resize(rows=needed_rows)

        ws.clear()
        ws.update(values=final_data, range_name='A1')
        print(f'SUCCESS: {len(results)} stocks pushed to Google Sheet!')
        "
