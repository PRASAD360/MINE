name: 1. Nifty High Beta Screener (Date Aligned)

on:
  schedule:
    - cron: '48 10 * * 1-5'  # 4:18 PM IST
  workflow_dispatch:

env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  SYMBOLS_WS: 'NIFTY500'          
  SYMBOLS_RANGE: 'A2:A502'      
  TARGET_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  TARGET_TAB_NAME: 'HIGH_BETA-LOW_PRICE' 

jobs:
  filter_high_beta_stocks:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pandas numpy --disable-pip-version-check

    - name: Run Screener Engine (Date Aligned)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        cat << 'EOF' > screener.py
        import os, json, gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        import pandas as pd
        import numpy as np
        import concurrent.futures

        # 1. Google Sheets Authentication
        creds = Credentials.from_service_account_info(
            json.loads(os.environ['GCP_CREDENTIALS']), 
            scopes=['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        )
        gc = gspread.authorize(creds)
        env = os.environ

        print("Fetching Symbols...")
        source_sh = gc.open_by_key(env['SOURCE_SPREADSHEET_ID'])
        raw_symbols = [r[0].strip() for r in source_sh.values_get(f"{env['SYMBOLS_WS']}!{env['SYMBOLS_RANGE']}").get('values', []) if r and str(r[0]).strip()]

        # 3. Nifty 50 Data & PERFECT DATE ALIGNMENT
        print("Fetching Nifty 50 Benchmark...")
        nifty = yf.Ticker("^NSEI").history(period="1y", interval="1d")
        
        # BULLETPROOF DATE LOCK (Removes Time/Timezone, keeps only pure date)
        nifty.index = pd.to_datetime(nifty.index).tz_localize(None).normalize()
        
        nifty_returns = nifty['Close'].pct_change().dropna()
        nifty_returns.name = 'Nifty'
        nifty_var = nifty_returns.var()

        if pd.isna(nifty_var) or nifty_var == 0:
            print("CRITICAL: Nifty Variance invalid.")
            exit(1)

        results = []
        def process_stock(sym):
            try:
                ticker = sym if any(sym.endswith(ext) for ext in ['.NS', '.BO']) else sym + '.NS'
                df = yf.Ticker(ticker).history(period="1y", interval="1d")
                
                if df.empty or len(df) < 50:
                    return None
                    
                current_price = float(df['Close'].iloc[-1])
                
                if not (100 <= current_price <= 500):
                    return None
                
                # STRICT DATE ALIGNMENT FOR STOCK
                df.index = pd.to_datetime(df.index).tz_localize(None).normalize()
                stock_returns = df['Close'].pct_change().dropna()
                stock_returns.name = 'Stock'
                
                # DATE-MATCHING CONCATENATION
                # join='inner' ensures ONLY dates present in BOTH Nifty & Stock are kept
                aligned = pd.concat([stock_returns, nifty_returns], axis=1, join='inner').dropna()
                
                if len(aligned) < 50:
                    return None
                    
                # Beta Math
                cov = aligned['Stock'].cov(aligned['Nifty'])
                beta = cov / nifty_var
                
                if not pd.isna(beta) and beta > 1.2:
                    return [sym, round(current_price, 2), round(float(beta), 2)]
            except Exception:
                pass
            return None

        print("Aligning Dates & Calculating Beta...")
        with concurrent.futures.ThreadPoolExecutor(max_workers=15) as executor:
            futures = {executor.submit(process_stock, s): s for s in raw_symbols}
            for f in concurrent.futures.as_completed(futures):
                res = f.result()
                if res:
                    results.append(res)

        results.sort(key=lambda x: x[2], reverse=True)
        print(f"Found {len(results)} stocks!")

        # 5. Push to Google Sheet
        target_sh = gc.open_by_key(env['TARGET_SPREADSHEET_ID'])
        target_tab = env['TARGET_TAB_NAME']
        
        try:
            ws = target_sh.worksheet(target_tab)
        except gspread.exceptions.WorksheetNotFound:
            ws = target_sh.add_worksheet(title=target_tab, rows=max(100, len(results)+10), cols=5)

        final_data = [['Symbol', 'Current_Price', 'Beta_1Y']] + results
        if len(final_data) > ws.row_count:
            ws.resize(rows=len(final_data)+20)
            
        ws.clear()
        ws.update(values=final_data, range_name='A1')
        print(f"Success! Filtered list pushed to Sheet.")
        EOF
        python3 screener.py
