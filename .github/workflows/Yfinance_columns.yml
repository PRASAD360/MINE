name: Get YFinance Columns

on:
  workflow_dispatch:
    inputs:
      spreadsheet_id:
        description: 'PEHLI SHEET ID (Jahan list save karni hai)'
        required: true
        default: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
      worksheet_name:
        description: 'Naye Tab ka naam jahan columns ki list aayegi'
        required: true
        default: 'YF_Columns'

jobs:
  fetch_columns:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install gspread google-auth yfinance --disable-pip-version-check

    - name: Fetch and Sync YFinance Columns
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SPREADSHEET_ID: ${{ github.event.inputs.spreadsheet_id || '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4' }}
        WORKSHEET_NAME: ${{ github.event.inputs.worksheet_name || 'YF_Columns' }}
      run: |
        python3 -c "
        import os, json
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf

        creds_json = os.environ.get('GCP_CREDENTIALS')
        spreadsheet_id = os.environ.get('SPREADSHEET_ID')
        worksheet_name = os.environ.get('WORKSHEET_NAME')

        if not creds_json:
            print('Error: GCP_CREDENTIALS secret missing hai.'); exit(1)

        stock = yf.Ticker('RELIANCE.NS')
        
        # 1. FIX: Fast Info attributes nikalne ka sahi tareeqa (dir() use karke)
        fast_info_keys = [attr for attr in dir(stock.fast_info) if not attr.startswith('_')]
        fast_info_keys.sort()

        # 2. Detailed Info columns nikalna
        try:
            detailed_info_keys = list(stock.info.keys())
            detailed_info_keys.sort()
        except:
            detailed_info_keys = []

        # Data prepare karna
        max_length = max(len(fast_info_keys), len(detailed_info_keys))
        data_to_upload = [['Fast Info (Attributes)', 'Detailed Info (Fundamentals)']]
        
        for i in range(max_length):
            col_a = fast_info_keys[i] if i < len(fast_info_keys) else ''
            col_b = detailed_info_keys[i] if i < len(detailed_info_keys) else ''
            data_to_upload.append([col_a, col_b])

        # 3. Authenticate & Update
        creds_dict = json.loads(creds_json)
        gc = gspread.authorize(Credentials.from_service_account_info(creds_dict, scopes=['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']))
        
        sh = gc.open_by_key(spreadsheet_id)
        try:
            worksheet = sh.worksheet(worksheet_name)
            worksheet.clear()
        except:
            worksheet = sh.add_worksheet(title=worksheet_name, rows=str(max_length + 10), cols='5')

        worksheet.update(data_to_upload, 'A1')
        worksheet.format('A1:B1', {'textFormat': {'bold': True}})
        print(f'Success! Updated {len(fast_info_keys)} fast_info and {len(detailed_info_keys)} detailed attributes.')
        "
