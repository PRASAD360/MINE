name: Live Market Time-Series Sync

on:
  schedule:
    # Indian Market time: 9:30 AM to 3:30 PM (Mon-Fri)
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:
    inputs:
      source_spreadsheet_id:
        description: 'PEHLI SHEET ID (Jahan NIFTY200 ke symbols hain)'
        required: true
        default: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
      source_worksheet_name:
        description: 'Pehli Sheet ke tab ka naam'
        required: true
        default: 'NIFTY200'
      source_column_range:
        description: 'Symbols kis column/range mein hain? (e.g., C2:C)'
        required: true
        default: 'C2:C201'
      target_spreadsheet_id:
        description: 'DUSRI SHEET ID (Jahan live data save karna hai)'
        required: true
        default: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
      target_worksheet_name:
        description: 'Dusri Sheet ke tab ka naam (e.g., LTP_History)'
        required: true
        default: 'LTP_History'
      data_point_to_fetch:
        description: 'Konsa data fetch karna hai? (e.g., last_price, open, day_high, day_low)'
        required: true
        default: 'last_price'

jobs:
  fetch_live_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install gspread google-auth yfinance pytz --disable-pip-version-check

    - name: Fetch Live Data & Append to Google Sheet
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SOURCE_SPREADSHEET_ID: ${{ github.event.inputs.source_spreadsheet_id || '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4' }}
        SOURCE_WORKSHEET_NAME: ${{ github.event.inputs.source_worksheet_name || 'NIFTY200' }}
        SOURCE_COLUMN_RANGE: ${{ github.event.inputs.source_column_range || 'C2:C' }}
        TARGET_SPREADSHEET_ID: ${{ github.event.inputs.target_spreadsheet_id || 'DUSRI_SHEET_KI_ID_YAHAN_DAALEIN' }}
        TARGET_WORKSHEET_NAME: ${{ github.event.inputs.target_worksheet_name || 'LTP_History' }}
        DATA_POINT: ${{ github.event.inputs.data_point_to_fetch || 'last_price' }}
      run: |
        python3 -c "
        import os, json, time
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        from datetime import datetime
        import pytz
        import concurrent.futures

        creds_json = os.environ.get('GCP_CREDENTIALS')
        source_id = os.environ.get('SOURCE_SPREADSHEET_ID')
        source_worksheet = os.environ.get('SOURCE_WORKSHEET_NAME')
        source_range = os.environ.get('SOURCE_COLUMN_RANGE')
        target_id = os.environ.get('TARGET_SPREADSHEET_ID')
        target_worksheet = os.environ.get('TARGET_WORKSHEET_NAME')
        data_point = os.environ.get('DATA_POINT')

        if not creds_json or target_id == 'DUSRI_SHEET_KI_ID_YAHAN_DAALEIN':
            print('Error: Credentials ya Target Spreadsheet ID missing hai.')
            exit(1)

        # 1. Google Authentication
        try:
            scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
            creds_dict = json.loads(creds_json)
            credentials = Credentials.from_service_account_info(creds_dict, scopes=scopes)
            gc = gspread.authorize(credentials)
        except Exception as e:
            print(f'Authentication Error: {e}'); exit(1)

        # 2. Fetch Symbols from Source
        print(f'Connecting to Source Spreadsheet range {source_range}...')
        try:
            source_sh = gc.open_by_key(source_id)
            cells = source_sh.worksheet(source_worksheet).get(source_range)
            
            clean_symbols = []
            ticker_list = []
            for row in cells:
                if row and row[0].strip():
                    sym = row[0].strip()
                    clean_symbols.append(sym)
                    ticker_list.append(sym + '.NS')
            print(f'Successfully fetched {len(clean_symbols)} symbols.')
        except Exception as e:
            print(f'Error fetching symbols: {e}'); exit(1)

        if not clean_symbols:
            print('No symbols found. Exiting.'); exit(0)

        # 3. Yfinance Data Fetch (Ultra-Fast with 3 Retries for Zero Error)
        results_dict = {}
        def fetch_stock_data(ticker):
            clean_name = ticker.replace('.NS', '')
            for attempt in range(3):  # Retry logic
                try:
                    val = getattr(yf.Ticker(ticker).fast_info, data_point)
                    return clean_name, round(val, 2) if isinstance(val, float) else val
                except Exception:
                    time.sleep(0.5) # Wait before retry
            return clean_name, '' # Agar 3 baar me bhi fail ho, to blank chhod do

        print(f'Fetching {data_point} for {len(ticker_list)} stocks using Multithreading...')
        with concurrent.futures.ThreadPoolExecutor(max_workers=20) as executor:
            futures = [executor.submit(fetch_stock_data, t) for t in ticker_list]
            for future in concurrent.futures.as_completed(futures):
                t, v = future.result()
                results_dict[t] = v

        # 4. Target Sheet Logic (Smart Mapping)
        ist = pytz.timezone('Asia/Kolkata')
        fetch_time_str = datetime.now(ist).strftime('%Y-%m-%d %H:%M:%S IST')

        target_sh = gc.open_by_key(target_id)
        try:
            target_ws = target_sh.worksheet(target_worksheet)
        except gspread.exceptions.WorksheetNotFound:
            target_ws = target_sh.add_worksheet(title=target_worksheet, rows='1000', cols=str(len(clean_symbols) + 1))

        # Get existing headers from Row 1
        existing_headers = target_ws.row_values(1)

        # Agar sheet nayi hai, to headers lagao
        if not existing_headers:
            existing_headers = ['Fetch Time'] + clean_symbols
            target_ws.append_row(existing_headers)
        else:
            # Agar purani sheet hai aur NIFTY200 me koi naya stock add hua hai, to header list me update karo
            new_cols = [s for s in clean_symbols if s not in existing_headers]
            if new_cols:
                existing_headers.extend(new_cols)
                # Google Sheet ki Row 1 ko update karna bina error ke
                cell_list = target_ws.range(1, 1, 1, len(existing_headers))
                for i, val in enumerate(existing_headers):
                    cell_list[i].value = val
                target_ws.update_cells(cell_list)

        # Exact Header ke hisab se data arrange karna (Apni apni column me)
        row_to_append = []
        for header in existing_headers:
            if header == 'Fetch Time':
                row_to_append.append(fetch_time_str)
            else:
                row_to_append.append(results_dict.get(header, '')) # Agar koi purana stock NIFTY200 se nikal gaya hai, to uski column blank rahegi

        # 5. Append and Clean (Resize)
        try:
            print('Appending mapped data to sheet...')
            target_ws.append_row(row_to_append)
            
            # Jo column faltu hain unko clear (delete) karna
            current_cols = target_ws.col_count
            needed_cols = len(existing_headers)
            if current_cols > needed_cols:
                print(f'Clearing {current_cols - needed_cols} extra blank columns...')
                target_ws.resize(cols=needed_cols)
                
            print(f'Success! Data appended perfectly at {fetch_time_str}')
        except Exception as e:
            print(f'Error updating target sheet: {e}'); exit(1)
        "
