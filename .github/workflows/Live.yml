name: Live Market Multi-Tab History Sync

on:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:
    inputs:
      source_spreadsheet_id:
        description: 'PEHLI SHEET ID (Jahan NIFTY200 ke symbols hain)'
        required: true
        default: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
      source_worksheet_name:
        description: 'Pehli Sheet ke tab ka naam'
        required: true
        default: 'NIFTY200'
      source_column_range:
        description: 'Symbols kis column/range mein hain?'
        required: true
        default: 'C2:C201'
      target_folder_id:
        description: 'GOOGLE DRIVE FOLDER ID'
        required: true
        default: '1po3JuCEpA95UgWJ1L2t-SOxCBxJvaRmR'

jobs:
  fetch_live_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pytz --disable-pip-version-check

    - name: Fetch Reliable Data via History & Update All Tabs
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        SOURCE_SPREADSHEET_ID: ${{ github.event.inputs.source_spreadsheet_id || '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4' }}
        SOURCE_WORKSHEET_NAME: ${{ github.event.inputs.source_worksheet_name || 'NIFTY200' }}
        SOURCE_COLUMN_RANGE: ${{ github.event.inputs.source_column_range || 'C2:C201' }}
        TARGET_FOLDER_ID: ${{ github.event.inputs.target_folder_id || '1po3JuCEpA95UgWJ1L2t-SOxCBxJvaRmR' }}
      run: |
        python3 -c "
        import os, json, time
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        from datetime import datetime
        import pytz
        import concurrent.futures

        creds_json = os.environ.get('GCP_CREDENTIALS')
        source_id = os.environ.get('SOURCE_SPREADSHEET_ID')
        source_worksheet = os.environ.get('SOURCE_WORKSHEET_NAME')
        source_range = os.environ.get('SOURCE_COLUMN_RANGE')
        folder_id = os.environ.get('TARGET_FOLDER_ID')

        # 1. Google Authentication
        scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        gc = gspread.authorize(Credentials.from_service_account_info(json.loads(creds_json), scopes=scopes))

        # 2. Fetch Symbols from Source Sheet
        try:
            source_sh = gc.open_by_key(source_id)
            cells = source_sh.worksheet(source_worksheet).get(source_range)
            ticker_list = [row[0].strip() + '.NS' for row in cells if row and row[0].strip()]
            clean_symbols = [row[0].strip() for row in cells if row and row[0].strip()]
            print(f'Successfully fetched {len(ticker_list)} symbols.')
        except Exception as e:
            print(f'Error fetching symbols: {e}'); exit(1)

        if not ticker_list:
            print('No symbols found. Exiting.'); exit(0)

        # 3. FIELD MAPPING (Tab Name -> History DataFrame Column)
        field_mapping = {
            'open': 'Open',
            'dayHigh': 'High',
            'dayLow': 'Low',
            'lastPrice': 'Close',
            'lastVolume': 'Volume'
        }

        master_data = {sym: {} for sym in clean_symbols}

        def fetch_stock_history(ticker):
            clean_name = ticker.replace('.NS', '')
            stock_info = {}
            for attempt in range(3):
                try:
                    df = yf.Ticker(ticker).history(period='1d')
                    if not df.empty:
                        row = df.iloc[-1]
                        for tab_title, col_name in field_mapping.items():
                            val = row.get(col_name, '')
                            stock_info[tab_title] = round(float(val), 2) if val != '' else ''
                        return clean_name, stock_info
                except Exception:
                    time.sleep(0.3)
            return clean_name, {k: '' for k in field_mapping.keys()}

        print('Fetching accurate stock metrics using history API...')
        with concurrent.futures.ThreadPoolExecutor(max_workers=25) as executor:
            futures = [executor.submit(fetch_stock_history, t) for t in ticker_list]
            for future in concurrent.futures.as_completed(futures):
                name, data = future.result()
                master_data[name] = data

        # 4. Open Today's Spreadsheet
        ist = pytz.timezone('Asia/Kolkata')
        current_dt = datetime.now(ist)
        today_sheet_name = current_dt.strftime('%d-%b-%Y')
        fetch_time_str = current_dt.strftime('%Y-%m-%d %H:%M:%S IST')

        try:
            target_sh = gc.open(today_sheet_name, folder_id=folder_id)
            worksheets = target_sh.worksheets()
        except Exception as e:
            print(f'Error: Spreadsheet \"{today_sheet_name}\" folder mein nahi mili! {e}')
            exit(1)

        # 5. Instant Update across all matching tabs
        for ws in worksheets:
            tab_name = ws.title
            if tab_name not in field_mapping:
                continue 

            existing_headers = ws.row_values(1)
            if not existing_headers:
                existing_headers = ['Fetch Time'] + clean_symbols
                ws.update(values=[existing_headers], range_name='A1')

            row_to_append = [fetch_time_str]
            for header in existing_headers:
                if header != 'Fetch Time':
                    stock_metrics = master_data.get(header, {})
                    row_to_append.append(stock_metrics.get(tab_name, ''))

            try:
                ws.append_row(row_to_append)
                print(f'Successfully updated tab: {tab_name}')
            except Exception as e:
                print(f'Error updating tab {tab_name}: {e}')

        print(f'Reliable sync completed at {fetch_time_str}!')
        "
