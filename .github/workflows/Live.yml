name: Live Market Dynamic Multi-Tab Sync

on:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

# --- CONFIGURATIONS SECTION ---
env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  CONFIG_WS: 'Config2'
  CONFIG_RANGE: 'A2:B201'
  COLS_WS: 'Fetch_Columns'
  COLS_RANGE: 'A1:A10'

jobs:
  fetch_live_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pytz --disable-pip-version-check

    - name: Config2 Multi-Target Sheet Sync & Rename
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python3 -c "
        import os, json, time
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        from datetime import datetime
        import pytz
        import concurrent.futures

        creds_json = os.environ.get('GCP_CREDENTIALS')
        source_id = os.environ.get('SOURCE_SPREADSHEET_ID')
        config_ws_name = os.environ.get('CONFIG_WS')
        config_range = os.environ.get('CONFIG_RANGE')
        cols_ws_name = os.environ.get('COLS_WS')
        cols_range = os.environ.get('COLS_RANGE')

        # 1. Google Authentication
        scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        gc = gspread.authorize(Credentials.from_service_account_info(json.loads(creds_json), scopes=scopes))

        try:
            source_sh = gc.open_by_key(source_id)
            
            # 2. Read Config2 (Target IDs in Col A, Symbols in Col B)
            config_cells = source_sh.worksheet(config_ws_name).get(config_range)
            
            target_configs = []
            all_symbols_set = set()
            
            for row in config_cells:
                if len(row) >= 2:
                    target_id = row[0].strip()
                    symbol = row[1].strip()
                    if target_id and symbol:
                        target_configs.append({'target_id': target_id, 'symbol': symbol})
                        all_symbols_set.add(symbol)
            
            # 3. Fetch Dynamic Column Names from Sheet
            col_cells = source_sh.worksheet(cols_ws_name).get(cols_range)
            dynamic_columns = [row[0].strip() for row in col_cells if row and row[0].strip()]
            
            print(f'Total Target Sheets: {len(target_configs)}, Unique Symbols: {len(all_symbols_set)}, Columns: {len(dynamic_columns)}')
        except Exception as e:
            print(f'Error reading config data from source sheet: {e}'); exit(1)

        if not target_configs or not dynamic_columns:
            print('No valid target IDs, symbols, or columns found. Exiting.'); exit(0)

        # 4. Fetch History Data via Multithreading (for all unique symbols)
        master_data = {sym: {} for sym in all_symbols_set}

        def fetch_stock_history(symbol):
            ticker = symbol + '.NS'
            stock_info = {}
            for attempt in range(3):
                try:
                    df = yf.Ticker(ticker).history(period='1d')
                    if not df.empty:
                        row = df.iloc[-1]
                        for col_name in dynamic_columns:
                            val = row.get(col_name, '')
                            stock_info[col_name] = round(float(val), 2) if val != '' and val is not None else ''
                        return symbol, stock_info
                except Exception:
                    time.sleep(0.3)
            return symbol, {k: '' for k in dynamic_columns}

        print('Fetching accurate stock metrics using history API...')
        with concurrent.futures.ThreadPoolExecutor(max_workers=25) as executor:
            futures = [executor.submit(fetch_stock_history, sym) for sym in all_symbols_set]
            for future in concurrent.futures.as_completed(futures):
                name, data = future.result()
                master_data[name] = data

        # 5. Timestamp Setup
        ist = pytz.timezone('Asia/Kolkata')
        current_dt = datetime.now(ist)
        fetch_time_str = current_dt.strftime('%Y-%m-%d %H:%M:%S IST')

        # 6. Iterate through each Target Spreadsheet, Rename (if needed), and Update Tabs
        for config in target_configs:
            target_id = config['target_id']
            symbol = config['symbol']
            
            try:
                target_sh = gc.open_by_key(target_id)
                
                # Check and set spreadsheet title to the symbol if not already matching
                if target_sh.title != symbol:
                    target_sh.update_title(symbol)
                    print(f'Renamed spreadsheet ID {target_id} to title: {symbol}')
            except Exception as e:
                print(f'Error opening or renaming target spreadsheet ID {target_id}: {e}')
                continue

            existing_worksheets = {ws.title: ws for ws in target_sh.worksheets()}

            for col_name in dynamic_columns:
                if col_name not in existing_worksheets:
                    print(f'Tab \"{col_name}\" target sheet ({symbol}) me nahi mila. Create kiya ja raha hai...')
                    ws = target_sh.add_worksheet(title=col_name, rows='1000', cols='5')
                else:
                    ws = existing_worksheets[col_name]

                # Headers check & update
                existing_headers = ws.row_values(1)
                expected_headers = ['Fetch Time', symbol]
                if not existing_headers or existing_headers != expected_headers:
                    ws.update(values=[expected_headers], range_name='A1')

                # Row data for this symbol
                stock_metrics = master_data.get(symbol, {})
                val_to_insert = stock_metrics.get(col_name, '')
                row_to_append = [fetch_time_str, val_to_insert]

                try:
                    ws.append_row(row_to_append)
                    print(f'Successfully updated target [{symbol}] -> Tab: {col_name}')
                except Exception as e:
                    print(f'Error updating target [{symbol}] tab {col_name}: {e}')

        print(f'Multi-target dynamic sync and rename completed successfully at {fetch_time_str}!')
        "
