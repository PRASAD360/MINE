name: Live Market Dynamic Multi-Tab Sync

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

# --- CONFIGURATIONS SECTION ---
env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  SYMBOLS_WS: 'Config2'
  SYMBOLS_RANGE: 'A2:A201'
  COLS_WS: 'Fetch_Columns'
  COLS_RANGE: 'A1:A10'
  TARGET_SPREADSHEET_ID: '1qN0dejA9E64BzvG1cCizBgXMWu8OWd0-_vHMhNyAMLU' # <--- Yahan apni Target Sheet ID dalein

jobs:
  fetch_live_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pytz --disable-pip-version-check

    - name: Smart Dynamic Sync to Single Target Sheet
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python3 -c "
        import os, json, time
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        from datetime import datetime
        import pytz
        import concurrent.futures

        creds_json = os.environ.get('GCP_CREDENTIALS')
        source_id = os.environ.get('SOURCE_SPREADSHEET_ID')
        target_id = os.environ.get('TARGET_SPREADSHEET_ID')
        symbols_ws_name = os.environ.get('SYMBOLS_WS')
        symbols_range = os.environ.get('SYMBOLS_RANGE')
        cols_ws_name = os.environ.get('COLS_WS')
        cols_range = os.environ.get('COLS_RANGE')

        # 1. Google Authentication
        scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        gc = gspread.authorize(Credentials.from_service_account_info(json.loads(creds_json), scopes=scopes))

        try:
            source_sh = gc.open_by_key(source_id)
            
            # 2. Fetch Symbols
            symbol_cells = source_sh.worksheet(symbols_ws_name).get(symbols_range)
            ticker_list = [row[0].strip() + '.NS' for row in symbol_cells if row and row[0].strip()]
            clean_symbols = [row[0].strip() for row in symbol_cells if row and row[0].strip()]
            
            # 3. Fetch Dynamic Column Names
            col_cells = source_sh.worksheet(cols_ws_name).get(cols_range)
            dynamic_columns = [row[0].strip() for row in col_cells if row and row[0].strip()]
            
            print(f'Symbols: {len(clean_symbols)}, Columns: {len(dynamic_columns)}')
        except Exception as e:
            print(f'Error fetching setup data: {e}'); exit(1)

        # 4. Fetch Data
        master_data = {sym: {} for sym in clean_symbols}
        def fetch_stock_history(ticker):
            clean_name = ticker.replace('.NS', '')
            try:
                df = yf.Ticker(ticker).history(period='1d')
                if not df.empty:
                    row = df.iloc[-1]
                    return clean_name, {col: round(float(row.get(col, 0)), 2) for col in dynamic_columns}
            except: pass
            return clean_name, {col: '' for col in dynamic_columns}

        with concurrent.futures.ThreadPoolExecutor(max_workers=25) as executor:
            futures = [executor.submit(fetch_stock_history, t) for t in ticker_list]
            for f in concurrent.futures.as_completed(futures):
                name, data = f.result()
                master_data[name] = data

        # 5. Open Target Sheet
        ist = pytz.timezone('Asia/Kolkata')
        fetch_time_str = datetime.now(ist).strftime('%Y-%m-%d %H:%M:%S')
        target_sh = gc.open_by_key(target_id)
        existing_worksheets = {ws.title: ws for ws in target_sh.worksheets()}

        # 6. Update Tabs
        for col_name in dynamic_columns:
            if col_name not in existing_worksheets:
                ws = target_sh.add_worksheet(title=col_name, rows='1000', cols=str(len(clean_symbols) + 5))
            else:
                ws = existing_worksheets[col_name]

            # Header check
            if not ws.row_values(1):
                ws.update(values=[['Fetch Time'] + clean_symbols], range_name='A1')

            # Append data
            row_to_append = [fetch_time_str] + [master_data.get(sym, {}).get(col_name, '') for sym in clean_symbols]
            ws.append_row(row_to_append)
            print(f'Updated tab: {col_name}')

        print('Sync completed!')
        "
