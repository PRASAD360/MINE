name: Dynamic Historical Data Sync

on:
  schedule:
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

# --- AAP YAHAN SE SAB KUCH MODIFY KAR SAKTE HAIN ---
env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  CONFIG_WS: 'Config'
  CONFIG_PERIOD_CELL: 'C1'
  CONFIG_INTERVAL_CELL: 'C2'
  SYMBOLS_WS: 'NIFTY200'
  SYMBOLS_RANGE: 'C2:C201'
  COLS_WS: 'Fetch_Columns'
  COLS_RANGE: 'A1:A10'
  TARGET_SPREADSHEET_ID: '1pCrEf9oCQg2c4lWpRgS3ejx8Aqa5xCnjp4K_ii3Q0IA'

jobs:
  fetch_historical_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pandas pytz --disable-pip-version-check

    - name: Historical Data Sync (Zero-Gap)
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python3 -c "
        import os, json, time
        import gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        import pandas as pd
        from datetime import datetime
        import concurrent.futures

        creds_json = os.environ.get('GCP_CREDENTIALS')
        source_id = os.environ.get('SOURCE_SPREADSHEET_ID')
        config_ws = os.environ.get('CONFIG_WS')
        config_period = os.environ.get('CONFIG_PERIOD_CELL')
        config_interval = os.environ.get('CONFIG_INTERVAL_CELL')
        symbols_ws = os.environ.get('SYMBOLS_WS')
        symbols_range = os.environ.get('SYMBOLS_RANGE')
        cols_ws = os.environ.get('COLS_WS')
        cols_range = os.environ.get('COLS_RANGE')
        target_id = os.environ.get('TARGET_SPREADSHEET_ID')

        scopes = ['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        gc = gspread.authorize(Credentials.from_service_account_info(json.loads(creds_json), scopes=scopes))

        # 1. Setup Fetch
        source_sh = gc.open_by_key(source_id)
        config_sheet = source_sh.worksheet(config_ws)
        period = config_sheet.acell(config_period).value or '1mo'
        interval = config_sheet.acell(config_interval).value or '1d'

        sym_data = source_sh.worksheet(symbols_ws).get(symbols_range)
        symbols = [r[0].strip() for r in sym_data if r and r[0].strip()]
        col_data = source_sh.worksheet(cols_ws).get(cols_range)
        columns = [r[0].strip() for r in col_data if r and r[0].strip()]

        # 2. Fetch Data
        master_data = {}
        def fetch(sym):
            df = yf.Ticker(sym + '.NS').history(period=period, interval=interval)
            return sym, df

        with concurrent.futures.ThreadPoolExecutor(max_workers=20) as executor:
            futures = {executor.submit(fetch, s): s for s in symbols}
            for f in concurrent.futures.as_completed(futures):
                sym, df = f.result()
                if not df.empty: master_data[sym] = df

        # 3. Align Data
        all_ts = sorted(list(set().union(*[d.index.strftime('%Y-%m-%d') for d in master_data.values()])))
        
        target_sh = gc.open_by_key(target_id)
        existing = {ws.title: ws for ws in target_sh.worksheets()}

        for col in columns:
            if col not in existing: ws = target_sh.add_worksheet(title=col, rows='1000', cols='50')
            else: ws = existing[col]
            
            matrix = [['Timestamp'] + symbols]
            for ts in all_ts:
                row = [ts]
                for sym in symbols:
                    val = master_data.get(sym, pd.DataFrame()).get(col, pd.Series())
                    row.append(round(float(val.get(ts, '')), 2) if ts in val and pd.notnull(val[ts]) else '')
                matrix.append(row)
            
            ws.clear()
            # Batch Writing
            for i in range(0, len(matrix), 500):
                ws.update(values=matrix[i:i+500], range_name=f'A{i+1}')
                time.sleep(0.5)
            print(f'Updated Tab: {col}')
        "
