name: Dynamic Historical Data Sync (Bulletproof)

on:
  schedule:
    - cron: '30 1 * * 1-5'   # Subah 7:00 AM IST (Monday to Friday)
    - cron: '30 19 * * 0-4'  # Raat/Subah 1:00 AM IST (Monday to Friday)
  workflow_dispatch:

env:
  SOURCE_SPREADSHEET_ID: '1VI2JG_lv1aJ_C0yj7_UKAJhslyXAGZ-BL0vqLSBYrj4'
  CONFIG_WS: 'Config'
  CONFIG_PERIOD_CELL: 'D1'
  CONFIG_INTERVAL_CELL: 'D2'
  SYMBOLS_WS: 'Config2'
  SYMBOLS_RANGE: 'A2:A201'
  COLS_WS: 'Fetch_Columns'
  COLS_RANGE: 'A1:A10'
  TARGET_SPREADSHEET_ID: '1pCrEf9oCQg2c4lWpRgS3ejx8Aqa5xCnjp4K_ii3Q0IA'

jobs:
  fetch_historical_data:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install gspread google-auth yfinance pandas pytz --disable-pip-version-check

    - name: Bulletproof Historical Data Sync
      env:
        GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      run: |
        python3 -c "
        import os, json, time, gspread
        from google.oauth2.service_account import Credentials
        import yfinance as yf
        import pandas as pd
        import concurrent.futures

        # 1. Setup & Credentials
        creds = Credentials.from_service_account_info(
            json.loads(os.environ['GCP_CREDENTIALS']), 
            scopes=['https://www.googleapis.com/auth/spreadsheets', 'https://www.googleapis.com/auth/drive']
        )
        gc = gspread.authorize(creds)
        
        source_sh = gc.open_by_key(os.environ['SOURCE_SPREADSHEET_ID'])
        cfg = source_sh.worksheet(os.environ['CONFIG_WS'])
        period = cfg.acell(os.environ['CONFIG_PERIOD_CELL']).value or '1mo'
        interval = cfg.acell(os.environ['CONFIG_INTERVAL_CELL']).value or '1d'
        
        raw_symbols = [r[0].strip() for r in source_sh.worksheet(os.environ['SYMBOLS_WS']).get(os.environ['SYMBOLS_RANGE']) if r and r[0].strip()]
        cols = [r[0].strip() for r in source_sh.worksheet(os.environ['COLS_WS']).get(os.environ['COLS_RANGE']) if r and r[0].strip()]

        # 2. Fetch Data with Smart Ticker Formatting
        master_dfs = {}
        def fetch(sym):
            try:
                # Suffix logic: Agar pehle se extension hai toh wahi rakho, warna .NS jodo
                ticker = sym if any(sym.endswith(ext) for ext in ['.NS', '.BO']) or sym.startswith('^') else sym + '.NS'
                df = yf.Ticker(ticker).history(period=period, interval=interval)
                if not df.empty:
                    df.index = df.index.strftime('%Y-%m-%d %H:%M:%S' if ':' in str(df.index[0]) else '%Y-%m-%d')
                    return sym, df
            except Exception as e:
                print(f'Error fetching {sym}: {e}')
            return sym, None

        print(f'Fetching data for {len(raw_symbols)} symbols (Period: {period}, Interval: {interval})...')
        with concurrent.futures.ThreadPoolExecutor(max_workers=20) as executor:
            futures = {executor.submit(fetch, s): s for s in raw_symbols}
            for f in concurrent.futures.as_completed(futures):
                sym, df = f.result()
                if df is not None: 
                    master_dfs[sym] = df

        if not master_dfs:
            print('Error: Yfinance se ek bhi symbol ka data nahi mila!')
            exit(1)

        # 3. Process & Write Data Safely
        target_sh = gc.open_by_key(os.environ['TARGET_SPREADSHEET_ID'])
        existing = {ws.title: ws for ws in target_sh.worksheets()}

        all_dates = sorted(list(set().union(*[df.index for df in master_dfs.values()])))
        valid_symbols = [s for s in raw_symbols if s in master_dfs]

        for col in cols:
            rows_data = [['Timestamp'] + valid_symbols]
            
            for ts in all_dates:
                row = [ts]
                for sym in valid_symbols:
                    val = ''
                    df = master_dfs[sym]
                    if col in df.columns and ts in df.index:
                        raw_val = df.at[ts, col]
                        if not pd.isna(raw_val):
                            try:
                                val = round(float(raw_val), 2)
                            except:
                                val = str(raw_val)
                    row.append(val)
                rows_data.append(row)

            # Dynamic Worksheet creation with safe row count
            needed_rows = len(rows_data) + 50
            needed_cols = len(valid_symbols) + 2
            
            if col in existing:
                ws = existing[col]
                # Ensure sheet has enough rows/cols to avoid out-of-bound errors
                if ws.row_count < needed_rows:
                    ws.add_rows(needed_rows - ws.row_count)
            else:
                ws = target_sh.add_worksheet(title=col, rows=str(max(2000, needed_rows)), cols=str(needed_cols))
                existing[col] = ws

            ws.clear()
            time.sleep(0.3)
            
            # Safe Chunking for wide tables (300 rows per batch to prevent Google API Payload Error)
            chunk_size = 300
            for i in range(0, len(rows_data), chunk_size):
                chunk = rows_data[i:i + chunk_size]
                ws.update(values=chunk, range_name=f'A{i+1}')
                time.sleep(0.4)
                
            print(f'Successfully synced Tab: {col} ({len(all_dates)} rows)')

        print('All Historical Data Synced Successfully with Zero Errors!')
        "
